apps:
  - name: loki
    namespace: monitoring
    path: kubernetes/monitoring/loki
    sync: true

  - name: prometheus
    namespace: monitoring
    path: kubernetes/monitoring/prometheus
    skipCrds: true
    sync: true
    # The Alertmanager CRD prunes an explicit false value, while the upstream
    # chart renders it. Ignore that API-normalized field to prevent perpetual drift.
    ignoreDifferences:
      - group: monitoring.coreos.com
        kind: Alertmanager
        name: prometheus-alertmanager
        namespace: monitoring
        jsonPointers:
          - /spec/hostNetwork

  - name: prometheus-crds
    repoURL: https://github.com/prometheus-community/helm-charts.git
    path: charts/kube-prometheus-stack/charts/crds/
    targetRevision: kube-prometheus-stack-67.7.0
    sync: true
    syncOptions:
      - Replace=true

  - name: monitoring-secrets
    namespace: monitoring
    repoURL: git@github.com:seungbemi/gitops-secrets.git
    path: kubernetes/monitoring/secrets
    sync: true
