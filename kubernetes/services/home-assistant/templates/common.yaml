---
{{- if .Values.configHelper.enabled }}
{{- $_ := required "configHelper.credentialsSecretName is required when configHelper is enabled" .Values.configHelper.credentialsSecretName }}
{{- $_ := required "configHelper.imagePullSecretName is required when configHelper is enabled" .Values.configHelper.imagePullSecretName }}
{{- if not (regexMatch "^sha256:[a-f0-9]{64}$" .Values.configHelper.image.digest) }}
{{- fail "configHelper.image.digest must be an immutable sha256 digest when configHelper is enabled" }}
{{- end }}
{{- $_ := set .Values.defaultPodOptions "imagePullSecrets" (list (dict "name" .Values.configHelper.imagePullSecretName)) }}
{{- end }}
{{- $_ := set (index .Values.controllers.main.containers "config-helper") "enabled" .Values.configHelper.enabled }}
{{- $_ := set (index .Values.persistence "config-helper-credentials") "enabled" .Values.configHelper.enabled }}
{{- include "bjw-s.common.loader.init" . }}

{{- define "home-assistant.hardcodedValues" -}}
# Set the nameOverride based on the release name if no override has been set
{{ if not .Values.global.nameOverride }}
global:
  nameOverride: "{{ .Release.Name }}"
{{ end }}
{{- end -}}
{{- $_ := mergeOverwrite .Values (include "home-assistant.hardcodedValues" . | fromYaml) -}}

{{/* Render the templates */}}
{{ include "bjw-s.common.loader.generate" . }}
