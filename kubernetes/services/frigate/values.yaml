# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/common-4.0.1/charts/library/common/values.yaml
# https://github.com/bjw-s/helm-charts/blob/common-3.1.0/charts/library/common/values.yaml
defaultPodOptions:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: coral-tpu-node
            operator: In
            values:
            - "true"

configHelper:
  # Frigate is the first read-only canary. Home Assistant remains disabled
  # until this path has been observed under normal load.
  enabled: true
  credentialsSecretName: frigate-config-helper
  imagePullSecretName: hermes-admin-gateway-registry
  image:
    repository: ghcr.io/seungbemi/hermes-config-helper
    tag: latest
    digest: sha256:1d3fb461ae171c60cdca88986071fc62719c7bb7ffef3eadd46dece53b6e21df

controllers:
  main:
    enabled: true
    strategy: RollingUpdate
    rollingUpdate:
        maxUnavailable: 1
        maxSurge: 0
    containers:
      main:
        image:
          repository: ghcr.io/blakeblackshear/frigate
          pullPolicy: IfNotPresent
          tag: "{{ .Chart.AppVersion }}"
        env:
          TZ: "Europe/Helsinki"
        envFrom:
          - secretRef:
              name: frigate-secrets
        probes:
          liveness:
            enabled: true
          readiness:
            enabled: true
          startup:
            enabled: true
        securityContext:
          privileged:  true
      config-helper:
        enabled: false
        image:
          repository: '{{ .Values.configHelper.image.repository }}'
          tag: '{{ .Values.configHelper.image.tag }}'
          digest: '{{ .Values.configHelper.image.digest }}'
          pullPolicy: IfNotPresent
        env:
          - name: CONFIG_HELPER_SERVICE
            value: frigate
          - name: CONFIG_HELPER_ROOT
            value: /config
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /livez
                port: 8444
                scheme: HTTPS
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /livez
                port: 8444
                scheme: HTTPS
          startup:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /livez
                port: 8444
                scheme: HTTPS
              failureThreshold: 30
              periodSeconds: 2
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65532
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: 5m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
  backup:
    type: cronjob
    cronjob:
      backoffLimit: 3
      concurrencyPolicy: Forbid
      failedJobsHistory: 3
      schedule: "0 6 * * *" # daily at 6:00 utc
      startingDeadlineSeconds: 30
      successfulJobsHistory: 3
      suspend: false
    containers:
      main:
        image:
          repository: alpine
          tag: latest
        command:
          - sh
          - -c
          - |
            tar -czvf /backups/backups.tar.gz -C / config

service:
  main:
    controller: main
    ports:
      http:
        port: 8971
      rtsp:
        port: 8554
      api: 
        port: 5000

persistence:
  data:
    enabled: true
    type: nfs
    server: diskstation.local
    path: /volume1/LTS/frigate
    advancedMounts:
      main:
        main:
        - path: /media/frigate
  config-folder:
    enabled: true
    storageClass: ceph-block
    advancedMounts:
      main:
        main:
          - path: /config
        config-helper:
          - path: /config
            readOnly: true
    accessMode: ReadWriteOnce
    size: "1Gi"
  backup:
    enabled: true
    type: nfs
    server: diskstation.local
    path: /volume1/LTS/backups/frigate
    advancedMounts:
      backup:
        main:
          - path: /backups
  shm:
    enabled: true
    type: emptyDir
    advancedMounts:
      main:
        main:
        - path: /dev/shm
    sizeLimit: 1Gi
    medium: Memory
  tpu:
    enabled: true
    type: hostPath
    hostPath: /dev/bus/usb
    advancedMounts:
      main:
        main:
          - path: /dev/bus/usb
  hwaccel:
    enabled: true
    type: hostPath
    hostPath: /dev/dri/renderD128
    advancedMounts:
      main:
        main:
          - path: /dev/dri/renderD128
  config-helper-credentials:
    enabled: false
    type: secret
    name: '{{ .Values.configHelper.credentialsSecretName }}'
    # The helper runs as an unprivileged UID and the Secret is mounted only in
    # that container, so files must be readable without relying on pod fsGroup.
    defaultMode: 292
    advancedMounts:
      main:
        config-helper:
          - path: /var/run/hermes-config-helper
            readOnly: true
