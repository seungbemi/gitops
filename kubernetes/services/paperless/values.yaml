# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/common-4.0.1/charts/library/common/values.yaml
# https://github.com/bjw-s/helm-charts/blob/common-3.1.0/charts/library/common/values.yaml

controllers:
  main:
    strategy: RollingUpdate
    rollingUpdate:
      unavailable: 1
      surge: 0
    initContainers:
      verify-nfs-write:
        image:
          repository: busybox
          tag: 1.37.0-uclibc
        command: ["/bin/sh", "-ec"]
        args:
          - |
            for directory in /usr/src/paperless/data /usr/src/paperless/media /usr/src/paperless/consume /usr/src/paperless/export; do
              test_file="$directory/.paperless-write-test-$$"
              : > "$test_file"
              printf 'write-test\n' >> "$test_file"
              rm "$test_file"
            done
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: 5m
            memory: 4Mi
          limits:
            memory: 16Mi
    containers:
      main:
        image:
          repository: ghcr.io/paperless-ngx/paperless-ngx
          tag: "{{ .Chart.AppVersion }}"
          pullPolicy: IfNotPresent
        env:
          TZ: "Europe/Helsinki"
          COMPOSE_PROJECT_NAME: paperless
          PAPERLESS_REDIS: redis://redis-master.persistence:6379
          PAPERLESS_OCR_LANGUAGES: fin kor
          PAPERLESS_OCR_LANGUAGE: eng+fin+kor
          USERMAP_UID: 1000
          USERMAP_GID: 1000
          PAPERLESS_TIME_ZONE: Europe/Helsinki
          PAPERLESS_DBENGINE: postgresql
          PAPERLESS_DBHOST: postgresql.persistence
          PAPERLESS_PORT: 8000
          PAPERLESS_CONSUMER_POLLING_INTERVAL: 300
          # Preserve the pre-v3 behavior of rejecting duplicate documents.
          PAPERLESS_CONSUMER_DELETE_DUPLICATES: true
        envFrom:
          - secretRef:
              name: paperless-secrets
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /api/
                port: 8000
                httpHeaders:
                  - name: Host
                    value: localhost
              periodSeconds: 30
              timeoutSeconds: 3
              failureThreshold: 3
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /api/
                port: 8000
                httpHeaders:
                  - name: Host
                    value: localhost
              periodSeconds: 10
              timeoutSeconds: 3
              failureThreshold: 3
          startup:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /api/
                port: 8000
                httpHeaders:
                  - name: Host
                    value: localhost
              periodSeconds: 5
              timeoutSeconds: 3
              failureThreshold: 60
        resources:
          requests:
            cpu: 16m
            memory: 1Gi

service:
  main:
    controller: main
    ports:
      http:
        port: 8000
persistence:
  data:
    enabled: true
    type: nfs
    server: diskstation.local
    path: /volume1/LTS/paperless/data
    globalMounts: 
      - path: /usr/src/paperless/data
  media:
    enabled: true
    type: nfs
    server: diskstation.local
    path: /volume1/LTS/paperless/media
    globalMounts: 
      - path: /usr/src/paperless/media

  consume:
    enabled: true
    type: nfs
    server: diskstation.local
    path: /volume2/shared/Paperless
    globalMounts: 
      - path: /usr/src/paperless/consume
  export:
    enabled: true
    type: nfs
    server: diskstation.local
    path: /volume1/LTS/paperless/export
    globalMounts:
      - path: /usr/src/paperless/export
