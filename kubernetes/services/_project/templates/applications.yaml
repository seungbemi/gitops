{{- range .Values.apps }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .name }}
  namespace: cicd
spec:
  destination:
    namespace: {{ .namespace }}
    {{- if .server }}
    server: {{ .server }}
    {{- else }}
    server: https://kubernetes.default.svc
    {{- end }}
  project: services
  {{- if .valueSources }}
  sources:
    - path: {{ .path }}
      repoURL: {{ .repoURL | default "https://github.com/seungbemi/gitops.git" }}
      targetRevision: {{ .targetRevision | default "HEAD" }}
      helm:
        {{- if .valueFiles }}
        valueFiles:
          {{- range .valueFiles }}
          - {{ . | quote }}
          {{- end }}
        {{- end }}
        {{- if .skipCrds }}
        skipCrds: true
        {{- end }}
    {{- range .valueSources }}
    - repoURL: {{ .repoURL }}
      targetRevision: {{ .targetRevision | default "HEAD" }}
      ref: {{ .ref }}
    {{- end }}
  {{- else }}
  source:
    path: {{ .path }}
    repoURL: {{ .repoURL | default "https://github.com/seungbemi/gitops.git" }}
    targetRevision: {{ .targetRevision | default "HEAD" }}
    {{- if or .skipCrds .valueFiles }}
    helm:
      {{- if .valueFiles }}
      valueFiles:
        {{- range .valueFiles }}
        - {{ . | quote }}
        {{- end }}
      {{- end }}
      {{- if .skipCrds }}
      skipCrds: true
      {{- end }}
    {{- end }}
  {{- end }}
  {{- if and .sync (eq .sync true) }}
  syncPolicy:
    {{- if .syncOptions }}
    syncOptions:
    {{- range .syncOptions }}
      - {{ . | quote }}
    {{- end }}
    {{- end }}
    automated:
      prune: true
      selfHeal: true
  {{- end }}
{{- end }}
