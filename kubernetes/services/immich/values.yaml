
# Immich application configuration
immich:
  controllers:
    main:
      containers:
        main:
          image:
            # renovate: image=ghcr.io/immich-app/immich-server
            tag: v3.3.3
          env:
            REDIS_HOSTNAME: redis-master.persistence
            IMMICH_MACHINE_LEARNING_URL: '{{ printf "http://%s-machine-learning:3003" .Release.Name }}'
            TZ: "Europe/Helsinki"
            IMMICH_LOG_LEVEL: "warn"
            IMMICH_VERSION: v3
          envFrom:
            - secretRef:
                name: immich-secrets
# Metrics configuration
  immich:
    metrics:
      # Enabling this will create the service monitors needed to monitor immich with the prometheus operator
      enabled: false

    # Persistence configuration
    persistence:
      # Main data store for all photos shared between different components.
      library:
        # Automatically creating the library volume is not supported by this chart
        # You have to specify an existing PVC to use
        existingClaim: pvc-immich

  # The configuration file is SOPS-encrypted in the private GitOps repository.
  # Keep domains and OAuth credentials out of this public repository.
  server:
    controllers:
      main:
        containers:
          main:
            env:
              IMMICH_CONFIG_FILE: /config/immich-config.yaml
    persistence:
      private-config:
        enabled: true
        type: secret
        name: immich-oidc
        globalMounts:
          - path: /config/immich-config.yaml
            subPath: immich-config.yaml
            readOnly: true

  # Configuration is immich-config.json converted to yaml
  # ref: https://immich.app/docs/install/config-file/
  configuration: {}
