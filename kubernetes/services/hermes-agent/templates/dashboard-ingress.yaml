{{- if and .Values.profile.enabled .Values.dashboard.enabled .Values.dashboard.ingress.enabled .Values.dashboard.ingress.create }}
{{- $host := trimPrefix "https://" (trimSuffix "/" .Values.dashboard.publicUrl) }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: hermes-{{ .Values.profile.name }}-dashboard
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hermes.labels" . | nindent 4 }}
spec:
  secretName: tls-cert-hermes-{{ .Values.profile.name }}-dashboard
  issuerRef:
    kind: ClusterIssuer
    name: {{ .Values.dashboard.ingress.clusterIssuer }}
  dnsNames:
    - {{ $host | quote }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: hermes-{{ .Values.profile.name }}-dashboard
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hermes.labels" . | nindent 4 }}
spec:
  entryPoints:
    - {{ .Values.dashboard.ingress.entryPoint }}
  routes:
    - kind: Rule
      match: Host(`{{ $host }}`)
      services:
        - name: hermes-{{ .Values.profile.name }}-dashboard
          port: {{ .Values.dashboard.port }}
  tls:
    secretName: tls-cert-hermes-{{ .Values.profile.name }}-dashboard
{{- end }}
