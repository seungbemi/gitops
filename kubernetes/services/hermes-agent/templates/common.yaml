{{- define "hermes.hardcodedValues" -}}
global:
  nameOverride: hermes-{{ .Values.profile.name }}
  createDefaultServiceAccount: false
{{- if .Values.credentialGateway.enabled }}
defaultPodOptions:
  imagePullSecrets:
    - name: {{ .Values.credentialGateway.imagePullSecretName }}
{{- end }}
controllers:
  main:
    forceRename: hermes-{{ .Values.profile.name }}
    serviceAccount:
      name: hermes-{{ .Values.profile.name }}
    labels:
      hermes-profile: {{ .Values.profile.name | quote }}
    pod:
      annotations:
        checksum/hermes-config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
        checksum/hermes-agent-profile: {{ include (print $.Template.BasePath "/agent-profile.yaml") . | sha256sum }}
        hermes.nousresearch.com/expected-version: {{ .Values.hermes.image.tag | quote }}
        hermes.nousresearch.com/gateway-owner: "hermes-container"
        hermes.nousresearch.com/dashboard-role: "administration-observer"
      labels:
        hermes-profile: {{ .Values.profile.name | quote }}
    containers:
      dashboard:
        enabled: {{ .Values.dashboard.enabled }}
        args: ["dashboard", "--host", "0.0.0.0", "--port", {{ .Values.dashboard.port | quote }}, "--no-open", "--skip-build"]
        env:
          - name: HERMES_HOME
            value: /opt/data
          - name: HERMES_DASHBOARD_PUBLIC_URL
            value: {{ .Values.dashboard.publicUrl | quote }}
          {{- if eq .Values.dashboard.auth.provider "nous" }}
          - name: HERMES_DASHBOARD_OAUTH_CLIENT_ID
            valueFrom:
              secretKeyRef:
                name: {{ .Values.dashboard.auth.secretName | quote }}
                key: HERMES_DASHBOARD_OAUTH_CLIENT_ID
          {{- else if eq .Values.dashboard.auth.provider "oidc" }}
          - name: HERMES_DASHBOARD_OIDC_ISSUER
            valueFrom:
              secretKeyRef:
                name: {{ .Values.dashboard.auth.secretName | quote }}
                key: HERMES_DASHBOARD_OIDC_ISSUER
          - name: HERMES_DASHBOARD_OIDC_CLIENT_ID
            valueFrom:
              secretKeyRef:
                name: {{ .Values.dashboard.auth.secretName | quote }}
                key: HERMES_DASHBOARD_OIDC_CLIENT_ID
          - name: HERMES_DASHBOARD_OIDC_SCOPES
            valueFrom:
              secretKeyRef:
                name: {{ .Values.dashboard.auth.secretName | quote }}
                key: HERMES_DASHBOARD_OIDC_SCOPES
                optional: true
          - name: HERMES_DASHBOARD_OIDC_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: {{ .Values.dashboard.auth.secretName | quote }}
                key: HERMES_DASHBOARD_OIDC_CLIENT_SECRET
                optional: true
          {{- else if eq .Values.dashboard.auth.provider "basic" }}
          - name: HERMES_DASHBOARD_BASIC_AUTH_USERNAME
            valueFrom:
              secretKeyRef:
                name: {{ .Values.dashboard.auth.secretName | quote }}
                key: HERMES_DASHBOARD_BASIC_AUTH_USERNAME
          - name: HERMES_DASHBOARD_BASIC_AUTH_PASSWORD
            valueFrom:
              secretKeyRef:
                name: {{ .Values.dashboard.auth.secretName | quote }}
                key: HERMES_DASHBOARD_BASIC_AUTH_PASSWORD
          - name: HERMES_DASHBOARD_BASIC_AUTH_SECRET
            valueFrom:
              secretKeyRef:
                name: {{ .Values.dashboard.auth.secretName | quote }}
                key: HERMES_DASHBOARD_BASIC_AUTH_SECRET
          {{- end }}
        probes:
          readiness:
            spec:
              httpGet:
                port: {{ .Values.dashboard.port }}
          liveness:
            spec:
              httpGet:
                port: {{ .Values.dashboard.port }}
      policy-gateway:
        enabled: {{ .Values.credentialGateway.enabled }}
    initContainers:
      install-approval-plugin:
        enabled: {{ .Values.credentialGateway.enabled }}
  browser:
    enabled: {{ .Values.browser.enabled }}
    forceRename: hermes-browser-{{ .Values.profile.name }}
    labels:
      hermes-profile: {{ .Values.profile.name | quote }}
    pod:
      labels:
        hermes-profile: {{ .Values.profile.name | quote }}
    containers:
      browser:
        args:
          - --port=8931
          - --host=0.0.0.0
          - --allowed-hosts={{ .Values.browser.allowedHosts }}
          - --blocked-origins=https://mail.google.com;http://mail.google.com;https://calendar.google.com;http://calendar.google.com;https://accounts.google.com;http://accounts.google.com;https://myaccount.google.com;http://myaccount.google.com;https://passwords.google.com;http://passwords.google.com;https://payments.google.com;http://payments.google.com
          - --block-service-workers
          - --shared-browser-context
          - --user-data-dir=/profile
          - --output-dir=/tmp/playwright-output
          - --output-max-size=52428800
          - --image-responses=allow
          {{- if .Values.credentialGateway.enabled }}
          - --proxy-server={{ .Values.browser.proxyUrl }}
          {{- end }}
service:
  dashboard:
    enabled: {{ .Values.dashboard.enabled }}
    forceRename: hermes-{{ .Values.profile.name }}-dashboard
    ports:
      http:
        port: {{ .Values.dashboard.port }}
        targetPort: {{ .Values.dashboard.port }}
  browser:
    enabled: {{ .Values.browser.enabled }}
    forceRename: hermes-browser-{{ .Values.profile.name }}
  gateway:
    enabled: {{ and .Values.credentialGateway.enabled .Values.browser.enabled }}
    forceRename: hermes-gateway-{{ .Values.profile.name }}
persistence:
  data:
    forceRename: hermes-{{ .Values.profile.name }}-data
  codex-runner-credentials:
    enabled: {{ .Values.codexDelegation.enabled }}
  config-helper-credentials:
    enabled: {{ .Values.configHelpers.enabled }}
  github-broker-credentials:
    enabled: {{ and .Values.credentialGateway.enabled .Values.credentialGateway.github.enabled }}
  browser-profile:
    enabled: {{ .Values.browser.enabled }}
    forceRename: hermes-browser-{{ .Values.profile.name }}-profile
  browser-shm:
    enabled: {{ .Values.browser.enabled }}
  browser-output:
    enabled: {{ .Values.browser.enabled }}
{{- end -}}
{{- if .Values.profile.enabled }}
{{- include "hermes.validateProfile" . }}
{{- include "bjw-s.common.loader.init" . }}
{{- $_ := mergeOverwrite .Values (include "hermes.hardcodedValues" . | fromYaml) -}}
{{ include "bjw-s.common.loader.generate" . }}
{{- end }}
