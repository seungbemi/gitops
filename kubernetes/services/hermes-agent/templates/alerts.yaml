{{- if and .Values.profile.enabled .Values.monitoring.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: hermes-{{ .Values.profile.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: hermes-agent
spec:
  groups:
    - name: hermes-{{ .Values.profile.name }}
      rules:
        - alert: HermesDeploymentUnavailable
          expr: kube_deployment_status_replicas_available{namespace="services",deployment="hermes-{{ .Values.profile.name }}"} < 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Hermes profile {{ `{{ $labels.deployment }}` }} is unavailable"
        {{- if .Values.browser.enabled }}
        - alert: HermesBrowserUnavailable
          expr: kube_deployment_status_replicas_available{namespace="services",deployment="hermes-browser-{{ .Values.profile.name }}"} < 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Hermes browser {{ `{{ $labels.deployment }}` }} is unavailable"
        {{- end }}
        - alert: HermesPersistentVolumeClaimPending
          expr: kube_persistentvolumeclaim_status_phase{namespace="services",persistentvolumeclaim=~"hermes(-browser)?-{{ .Values.profile.name }}.*",phase="Pending"} == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Hermes PVC {{ `{{ $labels.persistentvolumeclaim }}` }} is pending"
        - alert: HermesPersistentVolumeClaimFilling
          expr: (kubelet_volume_stats_available_bytes{namespace="services",persistentvolumeclaim=~"hermes(-browser)?-{{ .Values.profile.name }}.*"} / kubelet_volume_stats_capacity_bytes{namespace="services",persistentvolumeclaim=~"hermes(-browser)?-{{ .Values.profile.name }}.*"}) < 0.15
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Hermes PVC {{ `{{ $labels.persistentvolumeclaim }}` }} has less than 15% free"
        - alert: HermesUnknownApprovalOutcome
          expr: increase(hermes_approvals_total{profile="{{ .Values.profile.name }}",outcome="unknown"}[15m]) > 0
          labels:
            severity: critical
          annotations:
            summary: "Hermes reported an approval with an unknown outcome"
        - alert: HermesDependencyUnavailable
          expr: hermes_dependency_health{profile="{{ .Values.profile.name }}",state="unavailable"} == 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Hermes dependency {{ `{{ $labels.service }}` }} is unavailable"
        - alert: HermesGatewayHighErrorRatio
          expr: sum(rate(hermes_gateway_requests_total{profile="{{ .Values.profile.name }}",status=~"5.."}[15m])) / sum(rate(hermes_gateway_requests_total{profile="{{ .Values.profile.name }}"}[15m])) > 0.20 and sum(increase(hermes_gateway_requests_total{profile="{{ .Values.profile.name }}"}[15m])) >= 10
          labels:
            severity: warning
          annotations:
            summary: "Hermes gateway error ratio is above 20%"
        - alert: HermesToolHighFailureRatio
          expr: sum(rate(hermes_telemetry_events_total{profile="{{ .Values.profile.name }}",event_type="post_tool_call",outcome=~"error|failed|failure|timeout|unavailable"}[15m])) / sum(rate(hermes_telemetry_events_total{profile="{{ .Values.profile.name }}",event_type="post_tool_call"}[15m])) > 0.25 and sum(increase(hermes_telemetry_events_total{profile="{{ .Values.profile.name }}",event_type="post_tool_call"}[15m])) >= 10
          labels:
            severity: warning
          annotations:
            summary: "Hermes tool failure ratio is above 25%"
        - alert: HermesFrequentRestarts
          expr: sum(increase(kube_pod_container_status_restarts_total{namespace="services",pod=~"hermes-{{ .Values.profile.name }}-.*|paperless-.*"}[1h])) >= 3
          labels:
            severity: warning
          annotations:
            summary: "Hermes or Paperless restarted at least three times in one hour"
        - alert: HermesTelemetryDrops
          expr: increase(hermes_telemetry_dropped_total{profile="{{ .Values.profile.name }}"}[15m]) > 0
          labels:
            severity: warning
          annotations:
            summary: "Hermes telemetry events were dropped"
{{- end }}
