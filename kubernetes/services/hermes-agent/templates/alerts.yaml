{{- if and .Values.profile.enabled .Values.monitoring.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: hermes-{{ .Values.profile.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: hermes-agent
spec:
  groups:
    - name: hermes-{{ .Values.profile.name }}
      rules:
        - alert: HermesDeploymentUnavailable
          expr: kube_deployment_status_replicas_available{namespace="services",deployment="hermes-{{ .Values.profile.name }}"} < 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Hermes profile {{ `{{ $labels.deployment }}` }} is unavailable"
        {{- if .Values.browser.enabled }}
        - alert: HermesBrowserUnavailable
          expr: kube_deployment_status_replicas_available{namespace="services",deployment="hermes-browser-{{ .Values.profile.name }}"} < 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Hermes browser {{ `{{ $labels.deployment }}` }} is unavailable"
        {{- end }}
        - alert: HermesPersistentVolumeClaimPending
          expr: kube_persistentvolumeclaim_status_phase{namespace="services",persistentvolumeclaim=~"hermes(-browser)?-{{ .Values.profile.name }}.*",phase="Pending"} == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Hermes PVC {{ `{{ $labels.persistentvolumeclaim }}` }} is pending"
        - alert: HermesPersistentVolumeClaimFilling
          expr: (kubelet_volume_stats_available_bytes{namespace="services",persistentvolumeclaim=~"hermes(-browser)?-{{ .Values.profile.name }}.*"} / kubelet_volume_stats_capacity_bytes{namespace="services",persistentvolumeclaim=~"hermes(-browser)?-{{ .Values.profile.name }}.*"}) < 0.15
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Hermes PVC {{ `{{ $labels.persistentvolumeclaim }}` }} has less than 15% free"
        - alert: HermesUnknownApprovalOutcome
          expr: increase(hermes_approvals_total{profile="{{ .Values.profile.name }}",outcome="unknown"}[15m]) > 0
          labels:
            severity: critical
          annotations:
            summary: "Hermes reported an approval with an unknown outcome"
        - alert: HermesDependencyUnavailable
          expr: hermes_dependency_health{profile="{{ .Values.profile.name }}",state="unavailable"} == 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Hermes dependency {{ `{{ $labels.service }}` }} is unavailable"
        - alert: HermesTurnDeliveryStalled
          expr: hermes_turn_delivery_oldest_age_seconds{profile="{{ .Values.profile.name }}"} > 300 or hermes_turn_delivery_pending{profile="{{ .Values.profile.name }}"} > 10
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Hermes turn delivery is stalled"
            description: "A durable Telegram card batch has waited over five minutes or more than ten batches are queued."
        - alert: HermesTurnDeliveryFailure
          expr: sum(increase(hermes_turn_deliveries_total{profile="{{ .Values.profile.name }}",outcome=~"failed|unknown"}[15m])) > 0 or sum(increase(hermes_turn_deliveries_total{profile="{{ .Values.profile.name }}",outcome="retry"}[15m])) >= 3
          labels:
            severity: warning
          annotations:
            summary: "Hermes turn delivery needs attention"
            description: "A durable card batch failed, had an unknown post-send outcome, or retried at least three times."
        {{- if .Values.codexDelegation.enabled }}
        - alert: HermesCoderAuthenticationRequired
          expr: hermes_dependency_health{profile="{{ .Values.profile.name }}",service="coder",state="needs_login"} == 1
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "Hermes Codex delegation is paused because Coder authentication is required"
            description: "Rotate or repair the Coder credential, then verify the delegation preflight before retrying jobs."
        - alert: HermesCoderQuotaWaitProlonged
          expr: hermes_dependency_health{profile="{{ .Values.profile.name }}",service="coder",state="waiting_for_quota"} == 1
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Hermes Codex delegation has waited for quota for 30 minutes"
        {{- if .Values.codexDelegation.retentionCleanup.enabled }}
        - alert: HermesRetentionCleanupMissedSchedule
          expr: (time() - kube_cronjob_next_schedule_time{namespace="{{ .Release.Namespace }}",cronjob="hermes-{{ .Values.profile.name }}-retention"}) > {{ .Values.codexDelegation.retentionCleanup.startingDeadlineSeconds }} and on (namespace, cronjob) kube_cronjob_spec_suspend{namespace="{{ .Release.Namespace }}",cronjob="hermes-{{ .Values.profile.name }}-retention"} == 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Hermes retention cleanup missed its schedule"
            description: "The enabled retention CronJob has remained past its next scheduled run for longer than its starting-deadline window. No Job may exist, so generic failed-Job alerting cannot detect this condition."
        {{- end }}
        - alert: HermesTelegramOutboxStalled
          expr: hermes_notification_outbox_oldest_age_seconds{profile="{{ .Values.profile.name }}"} > 300 or hermes_notification_outbox_pending{profile="{{ .Values.profile.name }}"} > 10
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Hermes Telegram notification outbox is stalled"
            description: "The oldest pending notification is over five minutes old or more than ten notifications are queued."
        - alert: HermesTelegramDeliveryFailure
          expr: sum(increase(hermes_telegram_notifications_total{profile="{{ .Values.profile.name }}",outcome=~"rejected|unknown"}[15m])) > 0 or sum(increase(hermes_telegram_notifications_total{profile="{{ .Values.profile.name }}",outcome="retry"}[15m])) >= 3
          labels:
            severity: warning
          annotations:
            summary: "Hermes Telegram notification delivery needs attention"
            description: "A notification was permanently rejected, had an unknown durable outcome, or Telegram delivery retried at least three times."
        - alert: HermesTelegramDeliverySLOBreach
          expr: sum(increase(hermes_telegram_notifications_total{profile="{{ .Values.profile.name }}",outcome="success"}[24h])) / sum(increase(hermes_telegram_notifications_total{profile="{{ .Values.profile.name }}",outcome=~"success|rejected"}[24h])) < 0.99 and sum(increase(hermes_telegram_notifications_total{profile="{{ .Values.profile.name }}",outcome=~"success|rejected"}[24h])) >= 20
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Hermes Telegram delivery is below the 99% SLO"
            description: "Fewer than 99% of at least twenty terminal notification outcomes succeeded during the last 24 hours. Retries are measured separately."
        {{- if gt (int64 .Values.codexDelegation.coderTokenExpiresAtUnix) 0 }}
        - alert: HermesCoderTokenExpiring
          expr: vector(time()) > {{ sub (int64 .Values.codexDelegation.coderTokenExpiresAtUnix) 604800 }}
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Hermes Coder token expires within seven days"
            description: "Rotate the scoped Coder lifecycle token and update codexDelegation.coderTokenExpiresAtUnix before it expires."
        {{- end }}
        {{- end }}
        - alert: HermesGatewayHighErrorRatio
          expr: sum(rate(hermes_gateway_requests_total{profile="{{ .Values.profile.name }}",status=~"5.."}[15m])) / sum(rate(hermes_gateway_requests_total{profile="{{ .Values.profile.name }}"}[15m])) > 0.20 and sum(increase(hermes_gateway_requests_total{profile="{{ .Values.profile.name }}"}[15m])) >= 10
          labels:
            severity: warning
          annotations:
            summary: "Hermes gateway error ratio is above 20%"
        - alert: HermesToolHighFailureRatio
          expr: sum(rate(hermes_telemetry_events_total{profile="{{ .Values.profile.name }}",event_type="post_tool_call",outcome=~"error|failed|failure|timeout|unavailable"}[15m])) / sum(rate(hermes_telemetry_events_total{profile="{{ .Values.profile.name }}",event_type="post_tool_call"}[15m])) > 0.25 and sum(increase(hermes_telemetry_events_total{profile="{{ .Values.profile.name }}",event_type="post_tool_call"}[15m])) >= 10
          labels:
            severity: warning
          annotations:
            summary: "Hermes tool failure ratio is above 25%"
        - alert: HermesFrequentRestarts
          expr: sum(increase(kube_pod_container_status_restarts_total{namespace="services",pod=~"hermes-{{ .Values.profile.name }}-.*|paperless-.*"}[1h])) >= 3
          labels:
            severity: warning
          annotations:
            summary: "Hermes or Paperless restarted at least three times in one hour"
        - alert: HermesTelemetryDrops
          expr: increase(hermes_telemetry_dropped_total{profile="{{ .Values.profile.name }}"}[15m]) > 0
          labels:
            severity: warning
          annotations:
            summary: "Hermes telemetry events were dropped"
        - alert: HermesLLMHighFailureRatio
          expr: sum(rate(hermes_llm_requests_total{profile="{{ .Values.profile.name }}",outcome!="success"}[15m])) / sum(rate(hermes_llm_requests_total{profile="{{ .Values.profile.name }}"}[15m])) > 0.20 and sum(increase(hermes_llm_requests_total{profile="{{ .Values.profile.name }}"}[15m])) >= 10
          labels:
            severity: warning
          annotations:
            summary: "Hermes LLM failure ratio is above 20%"
        - alert: HermesLLMDailyBudgetExceeded
          expr: sum(increase(hermes_llm_cost_usd_total{profile="{{ .Values.profile.name }}"}[24h])) > {{ .Values.model.routing.dailyBudgetUSD }}
          labels:
            severity: warning
          annotations:
            summary: "Hermes exceeded its configured daily LLM budget"
        - alert: HermesLLMMonthlyBudgetExceeded
          expr: sum(increase(hermes_llm_cost_usd_total{profile="{{ .Values.profile.name }}"}[30d])) > {{ .Values.model.routing.monthlyBudgetUSD }}
          labels:
            severity: warning
          annotations:
            summary: "Hermes exceeded its configured 30-day LLM budget"
        {{- if .Values.model.routing.enabled }}
        - alert: HermesAutoRoutingMetadataMissing
          expr: sum(increase(hermes_llm_router_decisions_total{profile="{{ .Values.profile.name }}",metadata_available="false"}[1h])) == sum(increase(hermes_llm_router_decisions_total{profile="{{ .Values.profile.name }}"}[1h])) and sum(increase(hermes_llm_router_decisions_total{profile="{{ .Values.profile.name }}"}[1h])) >= 10
          labels:
            severity: warning
          annotations:
            summary: "All recent Hermes Auto Router calls lack routing metadata"
        - alert: HermesAutoRoutingPolicyDrift
          expr: sum(increase(hermes_llm_router_decisions_total{profile="{{ .Values.profile.name }}",cost_tier!="{{ .Values.model.routing.costTier }}"}[15m])) > 0
          labels:
            severity: warning
          annotations:
            summary: "Hermes Auto Router telemetry does not match the configured cost tier"
        {{- end }}
{{- end }}
