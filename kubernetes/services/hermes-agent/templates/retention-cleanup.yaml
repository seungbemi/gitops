{{- if and .Values.profile.enabled .Values.codexDelegation.enabled .Values.codexDelegation.retentionCleanup.enabled }}
{{- if .Values.codexDelegation.retentionCleanup.workspace.enabled }}
{{- if ne .Values.codexDelegation.retentionCleanup.workspace.mountPath "/workspace/jobs" }}
{{- fail "codexDelegation.retentionCleanup.workspace.mountPath must be /workspace/jobs" }}
{{- end }}
{{- if not .Values.codexDelegation.retentionCleanup.workspace.nfsServer }}
{{- fail "codexDelegation.retentionCleanup.workspace.nfsServer is required" }}
{{- end }}
{{- if not (hasSuffix "/jobs" .Values.codexDelegation.retentionCleanup.workspace.nfsPath) }}
{{- fail "codexDelegation.retentionCleanup.workspace.nfsPath must be the isolated jobs export" }}
{{- end }}
{{- end }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: hermes-{{ .Values.profile.name }}-retention
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: hermes-retention
    app.kubernetes.io/instance: {{ .Release.Name }}
    hermes-profile: {{ .Values.profile.name | quote }}
spec:
  schedule: {{ .Values.codexDelegation.retentionCleanup.schedule | quote }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: {{ .Values.codexDelegation.retentionCleanup.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.codexDelegation.retentionCleanup.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      backoffLimit: {{ .Values.codexDelegation.retentionCleanup.backoffLimit }}
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: hermes-retention
            app.kubernetes.io/instance: {{ .Release.Name }}
            hermes-profile: {{ .Values.profile.name | quote }}
        spec:
          automountServiceAccountToken: false
          enableServiceLinks: false
          restartPolicy: Never
          {{- if .Values.credentialGateway.imagePullSecretName }}
          imagePullSecrets:
            - name: {{ .Values.credentialGateway.imagePullSecretName }}
          {{- end }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 10000
            runAsGroup: 10000
            fsGroup: 10000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: cleanup
              image: "{{ .Values.credentialGateway.image.repository }}:{{ .Values.credentialGateway.image.tag }}@{{ .Values.credentialGateway.image.digest }}"
              imagePullPolicy: {{ .Values.credentialGateway.image.pullPolicy }}
              args: ["retention-cleanup"]
              env:
                - name: PROFILE
                  value: {{ .Values.profile.name | quote }}
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.credentialGateway.approvalSecretName | quote }}
                      key: DATABASE_URL
                - name: CODEX_DELEGATION
                  value: {{ toJson .Values.codexDelegation.authorization | quote }}
                {{- if .Values.codexDelegation.retentionCleanup.workspace.enabled }}
                - name: RUNNER_JOB_ROOT
                  value: {{ .Values.codexDelegation.retentionCleanup.workspace.mountPath | quote }}
                {{- end }}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 10000
                runAsGroup: 10000
                capabilities:
                  drop: ["ALL"]
              {{- if .Values.codexDelegation.retentionCleanup.workspace.enabled }}
              volumeMounts:
                - name: runner-jobs
                  mountPath: {{ .Values.codexDelegation.retentionCleanup.workspace.mountPath | quote }}
              {{- end }}
              resources:
                requests:
                  cpu: 5m
                  memory: 16Mi
                limits:
                  memory: 64Mi
          {{- if .Values.codexDelegation.retentionCleanup.workspace.enabled }}
          volumes:
            - name: runner-jobs
              nfs:
                server: {{ .Values.codexDelegation.retentionCleanup.workspace.nfsServer | quote }}
                path: {{ .Values.codexDelegation.retentionCleanup.workspace.nfsPath | quote }}
          {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hermes-{{ .Values.profile.name }}-retention
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: hermes-retention
      app.kubernetes.io/instance: {{ .Release.Name }}
      hermes-profile: {{ .Values.profile.name | quote }}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: persistence
          podSelector:
            matchLabels:
              app.kubernetes.io/name: postgresql
      ports:
        - { protocol: TCP, port: 5432 }
{{- end }}
