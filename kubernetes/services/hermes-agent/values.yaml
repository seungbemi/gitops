# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/common-5.1.0/charts/library/common/values.schema.json

# One Helm release represents one security principal. Private Argo values set
# the identity, Telegram allowlist, capabilities, and activation flag.
profile:
  enabled: false
  name: ""
  runtimeSecretName: ""
  telegram:
    allowedUserIds: []
    adminUserIds: []
    regularUserCommands: [status, history]
  kubernetes:
    scope: ""

# One immutable image pin is shared by bootstrap, gateway, and dashboard. The
# chart rejects a tag that differs from Chart.appVersion so these cooperating
# processes cannot silently run different Hermes releases.
hermes:
  image: &hermesImage
    repository: nousresearch/hermes-agent
    tag: v0.22.5
    digest: sha256:9c5561579f3ffdf333401797094ac3a743738d6c25d40f4331c7bf77b694238d
    pullPolicy: IfNotPresent
  configVersion: 51

model:
  main: openai/gpt-5.6-luna
  auxiliary: google/gemini-2.5-flash
  routing:
    # Promotion is gated by the measured baseline/canary procedure in README.
    enabled: false
    autoModel: openrouter/auto
    # Default to OpenRouter's cheapest capable band. Stronger models remain
    # available through Hermes's explicit one-turn/session model picker.
    costTier: low
    allowedModels:
      - openai/gpt-5.6-luna
      - openai/gpt-5-mini
      - google/gemini-2.5-flash
    maxPriceUSDPerMillion:
      prompt: 3
      completion: 15
    metadataEnabled: true
    dailyBudgetUSD: 2
    monthlyBudgetUSD: 15

scheduling:
  # Implemented behind a rollout flag; enable admin only after the P0 gates pass.
  enabled: false
  maxParallelJobs: 1
  misfireGraceMinutes: 10

agent:
  # Bound both spend and runaway tool loops. Expensive or complex work can use
  # a stronger model explicitly for a single turn or session.
  maxTurns: 15

# The dashboard is a privileged administration surface: it can edit Hermes
# configuration, credentials, hooks, and run operational commands. Public
# exposure is therefore allowed only with Hermes' built-in OAuth/OIDC gate.
dashboard:
  enabled: false
  port: 9119
  observer:
    # Serve the upstream dashboard through the policy gateway's fail-closed
    # read-only proxy. GitOps is the only configuration/write path.
    enabled: false
    port: 9120
  publicUrl: ""
  auth:
    # basic is allowed only while ingress is disabled. Public ingress requires
    # nous or oidc because upstream documents basic auth as LAN/VPN-only.
    provider: ""
    secretName: ""
  ingress:
    enabled: false
    # Set create=false when the shared routes chart owns the IngressRoute.
    create: true
    public: true
    entryPoint: websecure
    clusterIssuer: letsencrypt-prod

webSearch:
  enabled: false
  # Hermes rotates among its bundled anonymous search providers when no
  # provider key is configured and caches successful results to avoid repeat
  # lookups during an agent turn.
  keylessFallback: true
  cacheEnabled: true
  cacheTtlMinutes: 20

browser:
  enabled: false
  allowedHosts: ""
  mcpUrl: ""
  proxyUrl: ""

knowledgeBase:
  enabled: false
  # The policy gateway owns the Wiki.js credential and exposes only the
  # reviewed knowledge-base tool contract on this loopback endpoint.
  mcpUrl: ""

homeAssistant:
  enabled: false
  mcpUrl: ""
  # Needed only when the service resolves to host-network or external endpoints
  # and the CNI evaluates NetworkPolicy after destination translation.
  endpointCidrs: []

paperless:
  enabled: false
  mcpUrl: ""

codexDelegation:
  enabled: false
  mcpUrl: http://127.0.0.1:8090/delegation/mcp
  retentionCleanup:
    enabled: true
    # Kubernetes owns scheduling, retries, overlap prevention, and short job
    # history. The gateway image only performs one bounded cleanup pass.
    schedule: "17 3 * * *"
    # A missed schedule becomes actionable after the controller's allowed
    # catch-up window. Keep the CronJob and Prometheus alert on one value.
    startingDeadlineSeconds: 3600
    backoffLimit: 2
    successfulJobsHistoryLimit: 3
    failedJobsHistoryLimit: 3
    workspace:
      # Keep disabled unless a profile declares its exact runner jobs export.
      # The cleanup pod must never mount the runner home, tools, SDK, state,
      # mirrors, or the parent workspace directory.
      enabled: false
      nfsServer: ""
      nfsPath: ""
      mountPath: /workspace/jobs
  # Unix expiry of the currently deployed Coder API token. Keep this in sync
  # with every rotation so Prometheus warns seven days before authentication
  # stops. Zero disables the expiry alert for profiles without delegation.
  coderTokenExpiresAtUnix: 0
  # Add the private ingress/load-balancer CIDR when coder.url resolves inside
  # RFC1918 space. Public HTTPS is already covered by the baseline policy.
  coderEndpointCidrs: []
  credentialsSecretName: ""
  authorization:
    requester: ""
    # One Codex account executes one job at a time. Bound the durable backlog
    # so delayed work remains understandable and operator-recoverable.
    queueDomain: codex-account
    queueMaxActiveJobs: 10
    activeTurnSeconds: 3600
    jobBudgetSeconds: 28800
    retention:
      # One month is the maximum. Ephemeral proposals and delivered
      # notifications intentionally keep their existing shorter lifetime.
      jobDays: 30
      proposalDays: 7
      deliveredOutboxDays: 7
      dryRun: false
    coder:
      url: ""
      sessionTokenFile: /var/run/hermes-codex/coder-token
      caFile: /var/run/hermes-codex/coder-ca.crt
      organization: default
      user: me
      runnerNamespace: coder
      workspaceStartTimeoutSeconds: 300
      workspaceTtlSeconds: 86400
    targets: []

configHelpers:
  # Read-only, sanitized configuration inventory and snapshot access. The
  # helpers run beside the owning applications; only the gateway gets their
  # bearer tokens and private CA certificates.
  enabled: false
  mcpUrl: http://127.0.0.1:8090/config-helper/mcp
  credentialsSecretName: ""
  # Add exact node/host addresses here for host-network helpers when the CNI
  # evaluates NetworkPolicy after destination translation.
  endpointCidrs: []
  configuration:
    targets: []

kubernetes:
  apiServiceCidr: 10.96.0.1/32
  # Some CNIs enforce NetworkPolicy after Service DNAT. Supply the actual API
  # endpoint CIDRs through the private per-profile values when that applies.
  apiEndpointCidrs: []
  apiEndpointPort: 6443

monitoring:
  podMonitor:
    enabled: true
  prometheusRule:
    enabled: true

credentialGateway:
  enabled: false
  image:
    repository: ghcr.io/seungbemi/hermes-policy-gateway
    tag: sha-3d6827acab42e726bd862f27ca2666fe1cf191eb
    digest: sha256:4c6fd6bbb4dfca0b9889f3b6269bce04d77a87f066501ce271e61ab12df3eb37
  wikiSecretName: ""
  approvalSecretName: ""
  imagePullSecretName: ""
  wikiAuthorization:
    memberId: ""
    allowedOperations: []
  wikiGraphqlUrl: ""
  homeAssistantUrl: ""
  homeAssistantSecretName: unused
  homeAssistantAuthorization:
    enabled: false
    allowedOperations: []
    allowedServices: []
    allowedEntityPrefixes: []
    approvalRequiredEntities: []
  paperlessUrl: ""
  paperlessHost: ""
  paperlessPublicUrl: ""
  paperlessSecretName: unused
  paperlessAuthorization:
    enabled: false
    allowedOperations: []
  github:
    enabled: false
    secretName: unused

approvalPlugin:
  image:
    repository: ghcr.io/seungbemi/hermes-approval-plugin
    tag: sha-28b3625909be6ea77b27e8a29b1e6ffe7e608b9a
    digest: sha256:675bbc2874f6d79d5892be174bec354bc080f41293f1cfbd7478f7735f59a256

defaultPodOptions:
  automountServiceAccountToken: false
  enableServiceLinks: false
  securityContext:
    seccompProfile:
      type: RuntimeDefault

controllers:
  main:
    type: deployment
    strategy: Recreate
    replicas: 1
    pod:
      terminationGracePeriodSeconds: 45
      securityContext:
        fsGroup: 10000
        fsGroupChangePolicy: OnRootMismatch
    initContainers:
      verify-version:
        image: *hermesImage
        command: ["/bin/sh", "-ec"]
        args:
          - >-
            actual="$(/opt/hermes/.venv/bin/hermes --version)";
            printf '%s\n' "${actual}" | grep -Fq
            "Hermes Agent ${EXPECTED_HERMES_VERSION}" || {
            echo "Hermes CLI version does not match expected ${EXPECTED_HERMES_VERSION}: ${actual}" >&2;
            exit 1; }
        env:
          - name: EXPECTED_HERMES_VERSION
            value: '{{ .Values.hermes.image.tag }}'
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 10000
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: 5m
            memory: 16Mi
          limits:
            memory: 64Mi
      bootstrap-config:
        image: *hermesImage
        command: ["/bin/sh", "-c"]
        args:
          - >-
            cp /opt/bootstrap/config.yaml /opt/data/config.yaml &&
            cp /opt/bootstrap/SOUL.md /opt/data/SOUL.md &&
            mkdir -p /opt/data/cache/documents &&
            chown 10000:10000 /opt/data/config.yaml /opt/data/SOUL.md /opt/data/cache/documents &&
            chmod 0600 /opt/data/config.yaml &&
            chmod 0644 /opt/data/SOUL.md
        securityContext:
          allowPrivilegeEscalation: false
          runAsUser: 0
          capabilities:
            drop: ["ALL"]
            add: ["CHOWN", "DAC_OVERRIDE", "FOWNER"]
      install-approval-plugin:
        enabled: false
        image:
          repository: '{{ .Values.approvalPlugin.image.repository }}'
          tag: '{{ .Values.approvalPlugin.image.tag }}'
          digest: '{{ .Values.approvalPlugin.image.digest }}'
          pullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 10000
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: 5m
            memory: 8Mi
          limits:
            memory: 32Mi
    containers:
      hermes:
        image: *hermesImage
        args: ["gateway", "run"]
        env:
          - name: OPENROUTER_API_KEY
            valueFrom:
              secretKeyRef:
                name: '{{ .Values.profile.runtimeSecretName }}'
                key: OPENROUTER_API_KEY
          - name: TELEGRAM_BOT_TOKEN
            valueFrom:
              secretKeyRef:
                name: '{{ .Values.profile.runtimeSecretName }}'
                key: TELEGRAM_BOT_TOKEN
          - name: HERMES_UID
            value: "10000"
          - name: HERMES_GID
            value: "10000"
          - name: HERMES_AUTO_ROUTING_POLICY_ENABLED
            value: '{{ .Values.model.routing.enabled }}'
          - name: HERMES_ROUTING_COST_TIER
            value: '{{ .Values.model.routing.costTier }}'
          - name: HERMES_ROUTING_ALLOWED_MODELS
            value: '{{ join "," .Values.model.routing.allowedModels }}'
          - name: HERMES_ROUTING_MAX_PROMPT_USD_PER_MILLION
            value: '{{ .Values.model.routing.maxPriceUSDPerMillion.prompt }}'
          - name: HERMES_ROUTING_MAX_COMPLETION_USD_PER_MILLION
            value: '{{ .Values.model.routing.maxPriceUSDPerMillion.completion }}'
          - name: HERMES_ROUTING_METADATA_ENABLED
            value: '{{ .Values.model.routing.metadataEnabled }}'
          - name: TZ
            value: Europe/Helsinki
        envFrom:
          - configMapRef:
              name: 'hermes-{{ .Values.profile.name }}-environment'
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
            # s6 starts as root, changes /opt/data ownership to hermes, then
            # still needs to traverse and control the hermes-owned paths while
            # dropping supervised services to UID/GID 10000.
            add: ["CHOWN", "DAC_OVERRIDE", "SETGID", "SETUID"]
        probes:
          readiness:
            enabled: true
            custom: true
            spec:
              exec:
                command:
                  - pgrep
                  - -f
                  - 'hermes_cli\.main.*gateway run --replace$'
              periodSeconds: 10
              timeoutSeconds: 3
              failureThreshold: 3
          liveness:
            enabled: true
            custom: true
            spec:
              exec:
                command:
                  - pgrep
                  - -f
                  - 'hermes_cli\.main.*gateway run --replace$'
              periodSeconds: 30
              timeoutSeconds: 3
              failureThreshold: 3
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi
      dashboard:
        enabled: false
        image: *hermesImage
        args: ["dashboard", "--host", "0.0.0.0", "--port", "9119", "--no-open", "--skip-build"]
        env: []
        probes:
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /api/status
                port: 9119
              periodSeconds: 10
              timeoutSeconds: 3
              failureThreshold: 3
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /api/status
                port: 9119
              periodSeconds: 30
              timeoutSeconds: 3
              failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
            add: ["CHOWN", "DAC_OVERRIDE", "SETGID", "SETUID"]
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 512Mi
      kubernetes-mcp:
        image:
          repository: quay.io/containers/kubernetes_mcp_server
          tag: v0.0.69
          digest: sha256:5df586e2c7ced2a3125f6e78923388d80b69de0a2ad1470325b05318f12725bd
          pullPolicy: IfNotPresent
        args:
          - --port=8080
          - --read-only
          - --stateless
          - --disable-multi-cluster
          - --cluster-provider=in-cluster
          - --toolsets=core
          - --list-output=table
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65532
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: 20m
            memory: 64Mi
          limits:
            memory: 256Mi
      policy-gateway:
        enabled: false
        image:
          repository: '{{ .Values.credentialGateway.image.repository }}'
          tag: '{{ .Values.credentialGateway.image.tag }}'
          digest: '{{ .Values.credentialGateway.image.digest }}'
          pullPolicy: IfNotPresent
        env:
          - name: PROFILE
            value: '{{ .Values.profile.name }}'
          - name: LISTEN_ADDR
            value: 0.0.0.0:8090
          - name: PROXY_ADDR
            value: 0.0.0.0:8081
          - name: METRICS_ADDR
            value: 0.0.0.0:9090
          - name: DASHBOARD_OBSERVER_ADDR
            value: '{{ ternary (printf "0.0.0.0:%v" .Values.dashboard.observer.port) "" .Values.dashboard.observer.enabled }}'
          - name: DASHBOARD_UPSTREAM_URL
            value: '{{ ternary (printf "http://127.0.0.1:%v" .Values.dashboard.port) "" .Values.dashboard.observer.enabled }}'
          - name: WIKIJS_GRAPHQL_URL
            value: '{{ .Values.credentialGateway.wikiGraphqlUrl }}'
          - name: WIKI_AUTHORIZATION
            value: '{{ toJson .Values.credentialGateway.wikiAuthorization }}'
          - name: WIKIJS_API_TOKEN
            valueFrom:
              secretKeyRef:
                name: '{{ .Values.credentialGateway.wikiSecretName }}'
                key: WIKIJS_API_TOKEN
          - name: HOME_ASSISTANT_URL
            value: '{{ .Values.credentialGateway.homeAssistantUrl }}'
          - name: HOME_ASSISTANT_AUTHORIZATION
            value: '{{ toJson .Values.credentialGateway.homeAssistantAuthorization }}'
          - name: HOME_ASSISTANT_TOKEN
            valueFrom:
              secretKeyRef:
                name: '{{ .Values.credentialGateway.homeAssistantSecretName }}'
                key: HOME_ASSISTANT_TOKEN
                optional: true
          - name: PAPERLESS_URL
            value: '{{ .Values.credentialGateway.paperlessUrl }}'
          - name: PAPERLESS_HOST
            value: '{{ .Values.credentialGateway.paperlessHost }}'
          - name: PAPERLESS_PUBLIC_URL
            value: '{{ .Values.credentialGateway.paperlessPublicUrl }}'
          - name: DOCUMENT_CACHE_ROOT
            value: /var/lib/hermes-documents
          - name: PAPERLESS_AUTHORIZATION
            value: '{{ toJson .Values.credentialGateway.paperlessAuthorization }}'
          - name: PAPERLESS_TOKEN
            valueFrom:
              secretKeyRef:
                name: '{{ .Values.credentialGateway.paperlessSecretName }}'
                key: PAPERLESS_TOKEN
                optional: true
          - name: APPROVAL_HMAC_KEY
            valueFrom:
              secretKeyRef:
                name: '{{ .Values.credentialGateway.approvalSecretName }}'
                key: APPROVAL_HMAC_KEY
          - name: DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: '{{ .Values.credentialGateway.approvalSecretName }}'
                key: DATABASE_URL
          - name: TELEGRAM_BOT_TOKEN
            valueFrom:
              secretKeyRef:
                name: '{{ .Values.profile.runtimeSecretName }}'
                key: TELEGRAM_BOT_TOKEN
                optional: true
          - name: GITHUB_APP_ID
            valueFrom:
              secretKeyRef:
                name: '{{ .Values.credentialGateway.github.secretName }}'
                key: GITHUB_APP_ID
                optional: true
          - name: GITHUB_INSTALLATION_ID
            valueFrom:
              secretKeyRef:
                name: '{{ .Values.credentialGateway.github.secretName }}'
                key: GITHUB_INSTALLATION_ID
                optional: true
          - name: GITHUB_PRIVATE_KEY_FILE
            value: /var/run/hermes-github/GITHUB_PRIVATE_KEY
          - name: CODEX_DELEGATION
            value: '{{ ternary (toJson .Values.codexDelegation.authorization) "" .Values.codexDelegation.enabled }}'
          - name: CONFIG_HELPERS
            value: '{{ ternary (toJson .Values.configHelpers.configuration) "" .Values.configHelpers.enabled }}'
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /livez
                port: 8090
              periodSeconds: 30
              timeoutSeconds: 3
              failureThreshold: 3
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /readyz
                port: 8090
              periodSeconds: 10
              timeoutSeconds: 3
              failureThreshold: 3
        ports:
          - name: metrics
            containerPort: 9090
            protocol: TCP
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65532
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: 20m
            memory: 32Mi
          limits:
            memory: 128Mi
  browser:
    type: deployment
    strategy: Recreate
    replicas: 1
    pod:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    containers:
      browser:
        image:
          repository: mcr.microsoft.com/playwright/mcp
          tag: v0.0.83
          digest: sha256:dd64332608905c527ff0b34494e7671711693057191ea8ee10e674e4d621f23b
          pullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 2Gi

service:
  dashboard:
    controller: main
    ports:
      http:
        port: 9119
        targetPort: '{{ ternary .Values.dashboard.observer.port .Values.dashboard.port .Values.dashboard.observer.enabled }}'
  browser:
    controller: browser
    ports:
      mcp:
        port: 8931
        targetPort: 8931
  gateway:
    controller: main
    ports:
      proxy:
        port: 8081
        targetPort: 8081

persistence:
  data:
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    storageClass: ceph-block
    size: 5Gi
    advancedMounts:
      main:
        hermes:
          - path: /opt/data
        dashboard:
          - path: /opt/data
        bootstrap-config:
          - path: /opt/data
        install-approval-plugin:
          - path: /target
        policy-gateway:
          - path: /var/lib/hermes-documents
            subPath: cache/documents
            readOnly: true
  config:
    type: configMap
    name: 'hermes-{{ .Values.profile.name }}-config'
    items:
      - key: config.yaml
        path: config.yaml
    advancedMounts:
      main:
        bootstrap-config:
          - path: /opt/bootstrap/config.yaml
            subPath: config.yaml
            readOnly: true
        # The dashboard may inspect effective GitOps configuration, but its
        # configuration editor cannot persist changes to the shared data PVC.
        dashboard:
          - path: /opt/data/config.yaml
            subPath: config.yaml
            readOnly: true
  agent-profile:
    type: configMap
    name: 'hermes-{{ .Values.profile.name }}-agent-profile'
    items:
      - key: SOUL.md
        path: SOUL.md
    advancedMounts:
      main:
        bootstrap-config:
          - path: /opt/bootstrap/SOUL.md
            subPath: SOUL.md
            readOnly: true
        dashboard:
          - path: /opt/data/SOUL.md
            subPath: SOUL.md
            readOnly: true
  kubernetes-token:
    type: custom
    volumeSpec:
      projected:
        defaultMode: 288
        sources:
          - serviceAccountToken:
              path: token
              expirationSeconds: 3600
          - configMap:
              name: kube-root-ca.crt
              items:
                - key: ca.crt
                  path: ca.crt
          - downwardAPI:
              items:
                - path: namespace
                  fieldRef:
                    fieldPath: metadata.namespace
    advancedMounts:
      main:
        kubernetes-mcp:
          - path: /var/run/secrets/kubernetes.io/serviceaccount
            readOnly: true
  codex-runner-credentials:
    enabled: false
    type: secret
    name: '{{ .Values.codexDelegation.credentialsSecretName }}'
    advancedMounts:
      main:
        policy-gateway:
          - path: /var/run/hermes-codex
            readOnly: true
  config-helper-credentials:
    enabled: false
    type: secret
    name: '{{ .Values.configHelpers.credentialsSecretName }}'
    advancedMounts:
      main:
        policy-gateway:
          - path: /var/run/hermes-config-helpers
            readOnly: true
  github-broker-credentials:
    enabled: false
    type: secret
    name: '{{ .Values.credentialGateway.github.secretName }}'
    advancedMounts:
      main:
        policy-gateway:
          - path: /var/run/hermes-github
            readOnly: true
  browser-profile:
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    storageClass: ceph-block
    size: 2Gi
    advancedMounts:
      browser:
        browser:
          - path: /profile
  browser-shm:
    type: emptyDir
    medium: Memory
    sizeLimit: 1Gi
    advancedMounts:
      browser:
        browser:
          - path: /dev/shm
  browser-output:
    type: emptyDir
    sizeLimit: 100Mi
    advancedMounts:
      browser:
        browser:
          - path: /tmp/playwright-output
