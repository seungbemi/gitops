# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/common-5.1.0/charts/library/common/values.schema.json

# One Helm release represents one security principal. Private Argo values set
# the identity, Telegram allowlist, capabilities, and activation flag.
profile:
  enabled: false
  name: ""
  runtimeSecretName: ""
  telegram:
    allowedUserIds: []
    adminUserIds: []
    regularUserCommands: [status, history]
  kubernetes:
    scope: ""

model:
  main: openai/gpt-5.6-luna
  auxiliary: google/gemini-2.5-flash

agent:
  # Bound both spend and runaway tool loops. Expensive or complex work can use
  # a stronger model explicitly for a single turn or session.
  maxTurns: 15

browser:
  enabled: false
  allowedHosts: ""
  mcpUrl: ""
  proxyUrl: ""

knowledgeBase:
  enabled: false
  # The policy gateway owns the Wiki.js credential and exposes only the
  # reviewed knowledge-base tool contract on this loopback endpoint.
  mcpUrl: ""

kubernetes:
  apiServiceCidr: 10.96.0.1/32
  # Some CNIs enforce NetworkPolicy after Service DNAT. Supply the actual API
  # endpoint CIDRs through the private per-profile values when that applies.
  apiEndpointCidrs: []
  apiEndpointPort: 6443

monitoring:
  prometheusRule:
    enabled: true

credentialGateway:
  enabled: false
  image:
    repository: ghcr.io/seungbemi/hermes-policy-gateway
    tag: latest
    digest: sha256:f79a8de496c97461d0fd8a215d5d2ede3a233f6b1b3171ea212cef85b48a2ae7
  wikiSecretName: ""
  approvalSecretName: ""
  imagePullSecretName: ""
  wikiAllowedPrefixes: []
  wikiGraphqlUrl: ""
  github:
    enabled: false

defaultPodOptions:
  automountServiceAccountToken: false
  enableServiceLinks: false
  securityContext:
    seccompProfile:
      type: RuntimeDefault

controllers:
  main:
    type: deployment
    strategy: Recreate
    replicas: 1
    pod:
      terminationGracePeriodSeconds: 45
      securityContext:
        fsGroup: 10000
        fsGroupChangePolicy: OnRootMismatch
    initContainers:
      bootstrap-config:
        image:
          repository: nousresearch/hermes-agent
          tag: v2026.8.31
          digest: sha256:64923faeae267792bf9bf87fe3b4c4869e35004e360c7df01730ad801b74d524
          pullPolicy: IfNotPresent
        command: ["/bin/sh", "-c"]
        args:
          - >-
            cp /opt/bootstrap/config.yaml /opt/data/config.yaml &&
            cp /opt/bootstrap/SOUL.md /opt/data/SOUL.md &&
            if [ -d /opt/bootstrap/approval-plugin ]; then
              mkdir -p /opt/data/plugins/approval-gateway &&
              cp /opt/bootstrap/approval-plugin/plugin.yaml /opt/data/plugins/approval-gateway/plugin.yaml &&
              cp /opt/bootstrap/approval-plugin/__init__.py /opt/data/plugins/approval-gateway/__init__.py;
            fi &&
            chown 10000:10000 /opt/data/config.yaml /opt/data/SOUL.md &&
            if [ -d /opt/data/plugins/approval-gateway ]; then
              chown -R 10000:10000 /opt/data/plugins/approval-gateway;
            fi &&
            chmod 0600 /opt/data/config.yaml &&
            chmod 0644 /opt/data/SOUL.md
        securityContext:
          allowPrivilegeEscalation: false
          runAsUser: 0
          capabilities:
            drop: ["ALL"]
            add: ["CHOWN", "DAC_OVERRIDE", "FOWNER"]
    containers:
      hermes:
        image:
          repository: nousresearch/hermes-agent
          tag: v2026.8.31
          digest: sha256:64923faeae267792bf9bf87fe3b4c4869e35004e360c7df01730ad801b74d524
          pullPolicy: IfNotPresent
        args: ["gateway", "run"]
        env:
          - name: OPENROUTER_API_KEY
            valueFrom:
              secretKeyRef:
                name: '{{ .Values.profile.runtimeSecretName }}'
                key: OPENROUTER_API_KEY
          - name: TELEGRAM_BOT_TOKEN
            valueFrom:
              secretKeyRef:
                name: '{{ .Values.profile.runtimeSecretName }}'
                key: TELEGRAM_BOT_TOKEN
          - name: HERMES_UID
            value: "10000"
          - name: HERMES_GID
            value: "10000"
          - name: HERMES_GATEWAY_NO_SUPERVISE
            value: "1"
          - name: TZ
            value: Europe/Helsinki
        envFrom:
          - configMapRef:
              name: 'hermes-{{ .Values.profile.name }}-environment'
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
            # s6 starts as root, changes /opt/data ownership to hermes, then
            # still needs to traverse and control the hermes-owned paths while
            # dropping supervised services to UID/GID 10000.
            add: ["CHOWN", "DAC_OVERRIDE", "SETGID", "SETUID"]
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi
      kubernetes-mcp:
        image:
          repository: quay.io/containers/kubernetes_mcp_server
          tag: v0.0.65
          digest: sha256:5df586e2c7ced2a3125f6e78923388d80b69de0a2ad1470325b05318f12725bd
          pullPolicy: IfNotPresent
        args:
          - --port=8080
          - --read-only
          - --stateless
          - --disable-multi-cluster
          - --cluster-provider=in-cluster
          - --toolsets=core
          - --list-output=table
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65532
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: 20m
            memory: 64Mi
          limits:
            memory: 256Mi
      policy-gateway:
        enabled: false
        image:
          repository: '{{ .Values.credentialGateway.image.repository }}'
          tag: '{{ .Values.credentialGateway.image.tag }}'
          digest: '{{ .Values.credentialGateway.image.digest }}'
          pullPolicy: IfNotPresent
        env:
          - name: PROFILE
            value: '{{ .Values.profile.name }}'
          - name: LISTEN_ADDR
            value: 0.0.0.0:8090
          - name: PROXY_ADDR
            value: 0.0.0.0:8081
          - name: WIKIJS_GRAPHQL_URL
            value: '{{ .Values.credentialGateway.wikiGraphqlUrl }}'
          - name: WIKI_ALLOWED_PREFIXES
            value: '{{ join "," .Values.credentialGateway.wikiAllowedPrefixes }}'
          - name: WIKIJS_API_TOKEN
            valueFrom:
              secretKeyRef:
                name: '{{ .Values.credentialGateway.wikiSecretName }}'
                key: WIKIJS_API_TOKEN
          - name: APPROVAL_HMAC_KEY
            valueFrom:
              secretKeyRef:
                name: '{{ .Values.credentialGateway.approvalSecretName }}'
                key: APPROVAL_HMAC_KEY
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65532
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: 20m
            memory: 32Mi
          limits:
            memory: 128Mi
  browser:
    type: deployment
    strategy: Recreate
    replicas: 1
    pod:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    containers:
      browser:
        image:
          repository: mcr.microsoft.com/playwright/mcp
          tag: v0.0.77
          digest: sha256:dd64332608905c527ff0b34494e7671711693057191ea8ee10e674e4d621f23b
          pullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 2Gi

service:
  browser:
    controller: browser
    ports:
      mcp:
        port: 8931
        targetPort: 8931
  gateway:
    controller: main
    ports:
      proxy:
        port: 8081
        targetPort: 8081

persistence:
  data:
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    storageClass: ceph-block
    size: 5Gi
    advancedMounts:
      main:
        hermes:
          - path: /opt/data
        bootstrap-config:
          - path: /opt/data
  config:
    type: configMap
    name: 'hermes-{{ .Values.profile.name }}-config'
    items:
      - key: config.yaml
        path: config.yaml
    advancedMounts:
      main:
        bootstrap-config:
          - path: /opt/bootstrap/config.yaml
            subPath: config.yaml
            readOnly: true
  agent-profile:
    type: configMap
    name: 'hermes-{{ .Values.profile.name }}-agent-profile'
    items:
      - key: SOUL.md
        path: SOUL.md
    advancedMounts:
      main:
        bootstrap-config:
          - path: /opt/bootstrap/SOUL.md
            subPath: SOUL.md
            readOnly: true
  approval-plugin:
    type: configMap
    name: 'hermes-{{ .Values.profile.name }}-approval-plugin'
    advancedMounts:
      main:
        bootstrap-config:
          - path: /opt/bootstrap/approval-plugin
            readOnly: true
  kubernetes-token:
    type: custom
    volumeSpec:
      projected:
        defaultMode: 288
        sources:
          - serviceAccountToken:
              path: token
              expirationSeconds: 3600
          - configMap:
              name: kube-root-ca.crt
              items:
                - key: ca.crt
                  path: ca.crt
          - downwardAPI:
              items:
                - path: namespace
                  fieldRef:
                    fieldPath: metadata.namespace
    advancedMounts:
      main:
        kubernetes-mcp:
          - path: /var/run/secrets/kubernetes.io/serviceaccount
            readOnly: true
  browser-profile:
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    storageClass: ceph-block
    size: 2Gi
    advancedMounts:
      browser:
        browser:
          - path: /profile
  browser-shm:
    type: emptyDir
    medium: Memory
    sizeLimit: 1Gi
    advancedMounts:
      browser:
        browser:
          - path: /dev/shm
  browser-output:
    type: emptyDir
    sizeLimit: 100Mi
    advancedMounts:
      browser:
        browser:
          - path: /tmp/playwright-output
