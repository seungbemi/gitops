profile:
  # Enable only after the runtime Secret exists and the private Telegram
  # identity values have been set in gitops-secrets.
  enabled: false
  name: rina
  runtimeSecretName: hermes-rina-runtime
  telegram:
    # Overridden by $private/kubernetes/services/hermes-agent/profiles/rina.yaml.
    allowedUserIds: []
    adminUserIds: []
    regularUserCommands: [status, history]
  kubernetes:
    scope: rina-company

browser:
  enabled: false
  allowedHosts: hermes-browser-rina.services.svc.cluster.local,hermes-browser-rina

knowledgeBase:
  enabled: false
