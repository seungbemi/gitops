profile:
  # Enable only after the runtime Secret exists and the private Telegram
  # identity values have been set in gitops-secrets.
  enabled: false
  name: rina
  runtimeSecretName: hermes-rina-runtime
  telegram:
    # Overridden by $private/kubernetes/services/hermes-agent/profiles/rina.yaml.
    allowedUserIds: []
    adminUserIds: []
    regularUserCommands: [status, history]
  kubernetes:
    scope: rina-company

browser:
  enabled: false

knowledgeBase:
  enabled: false

credentialGateway:
  enabled: false
  wikiSecretName: hermes-rina-knowledge
  approvalSecretName: hermes-rina-approval
  imagePullSecretName: hermes-rina-gateway-registry
  homeAssistantSecretName: hermes-rina-home-assistant
  paperlessSecretName: hermes-rina-paperless
  wikiAuthorization:
    memberId: rina
    allowedOperations: [list, search, get, create, update, delete, move]
