profile:
  # Enable only after the runtime Secret exists and the private Telegram
  # identity values have been set in gitops-secrets.
  enabled: true
  name: admin
  runtimeSecretName: hermes-admin-runtime
  telegram:
    # Overridden by $private/kubernetes/services/hermes-agent/profiles/admin.yaml.
    allowedUserIds: []
    adminUserIds: []
  kubernetes:
    scope: cluster

browser:
  enabled: false

knowledgeBase:
  enabled: false

homeAssistant:
  enabled: false

paperless:
  enabled: false

credentialGateway:
  # Enable together with knowledgeBase after rotating the credentials and
  # making the pinned GHCR package pullable by the cluster.
  enabled: false
  wikiSecretName: hermes-admin-knowledge
  approvalSecretName: hermes-admin-approval
  imagePullSecretName: hermes-admin-gateway-registry
  homeAssistantSecretName: hermes-admin-home-assistant
  paperlessSecretName: hermes-admin-paperless
  wikiAuthorization:
    memberId: sebe
    allowedOperations: [list, search, get, create, update, delete, move]
  homeAssistantAuthorization:
    enabled: false
    allowedOperations: [list_entities, get_state, get_history, list_services, set_power, call_service]
    allowedServices: ["*"]
    allowedEntityPrefixes: ["*"]
    approvalRequiredEntities: []
  paperlessAuthorization:
    enabled: false
    allowedOperations: [search_documents, get_document, get_document_content, list_tags, list_correspondents, list_document_types, download_document, upload_document, update_document, delete_document]
