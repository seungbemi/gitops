# Run manually for a rehearsal or final migration dump. The generated directory
# is immutable and can be selected by the restore Job's DUMP_DIRECTORY value.
apiVersion: batch/v1
kind: Job
metadata:
  generateName: backup-postgres-migration-
  namespace: persistence
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgresql-migration-backup
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backup
          image: ghcr.io/seungbemi/postgres-vectorchord:17.11-pgvector0.8.6-vchord1.1.1@sha256:f0f3b52a14563ee4e87e91a906b17ab70a35fcfdb01eaa7885abde3e9377f74a
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              umask 077
              stamp="$(date -u +%Y%m%dT%H%M%SZ)"
              root=/backup/postgresql-migration
              temporary="$root/.${stamp}.partial"
              completed="$root/$stamp"
              mkdir -p "$temporary"

              pg_dumpall \
                --host="$SOURCE_HOST" \
                --username=postgres \
                --globals-only \
                --quote-all-identifiers \
                --file="$temporary/globals.sql"

              psql \
                --host="$SOURCE_HOST" \
                --username=postgres \
                --dbname=postgres \
                --no-psqlrc \
                --tuples-only \
                --no-align \
                --command="SELECT datname FROM pg_database WHERE NOT datistemplate ORDER BY datname" |
                while IFS= read -r database; do
                  test -n "$database"
                  pg_dump \
                    --host="$SOURCE_HOST" \
                    --username=postgres \
                    --dbname="$database" \
                    --format=custom \
                    --compress=6 \
                    --quote-all-identifiers \
                    --file="$temporary/$database.dump"
                  pg_restore --list "$temporary/$database.dump" >/dev/null
                done

              (cd "$temporary" && sha256sum globals.sql ./*.dump > SHA256SUMS)
              touch "$temporary/COMPLETE"
              mv "$temporary" "$completed"
              printf 'Migration dump created at %s\n' "$completed"
          env:
            - name: SOURCE_HOST
              value: postgresql
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: postgres-password
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - mountPath: /backup
              name: database
            - mountPath: /tmp
              name: tmp
      volumes:
        - name: database
          nfs:
            path: /volume1/LTS/database
            server: diskstation.local
        - name: tmp
          emptyDir: {}
