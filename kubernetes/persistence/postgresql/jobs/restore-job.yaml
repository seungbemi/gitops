# Set DUMP_DIRECTORY to a completed backup directory before creating this Job.
apiVersion: batch/v1
kind: Job
metadata:
  generateName: restore-postgres-v17-
  namespace: persistence
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgresql-migration-restore
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: restore
          image: ghcr.io/seungbemi/postgres-vectorchord:17.11-pgvector0.8.6-vchord1.1.1@sha256:f0f3b52a14563ee4e87e91a906b17ab70a35fcfdb01eaa7885abde3e9377f74a
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-euo", "pipefail", "-c"]
          args:
            - |
              if [[ "$DUMP_DIRECTORY" == REPLACE_ME ]]; then
                echo 'Set DUMP_DIRECTORY to a completed migration backup directory.' >&2
                exit 2
              fi
              test -f "$DUMP_DIRECTORY/COMPLETE"
              (cd "$DUMP_DIRECTORY" && sha256sum --check SHA256SUMS)

              # The official image bootstraps postgres, so retain ALTER ROLE and
              # password statements but omit the one duplicate CREATE ROLE.
              sed '/^CREATE ROLE "postgres";$/d' \
                "$DUMP_DIRECTORY/globals.sql" >/tmp/globals.sql
              psql \
                --host="$TARGET_HOST" \
                --username=postgres \
                --dbname=postgres \
                --no-psqlrc \
                --set=ON_ERROR_STOP=1 \
                --file=/tmp/globals.sql

              shopt -s nullglob
              dumps=("$DUMP_DIRECTORY"/*.dump)
              (( ${#dumps[@]} > 0 ))
              for dump in "${dumps[@]}"; do
                database="$(basename "$dump" .dump)"
                if [[ "$database" == postgres ]]; then
                  pg_restore \
                    --host="$TARGET_HOST" \
                    --username=postgres \
                    --dbname=postgres \
                    --clean \
                    --if-exists \
                    --exit-on-error \
                    --jobs=4 \
                    "$dump"
                else
                  pg_restore \
                    --host="$TARGET_HOST" \
                    --username=postgres \
                    --dbname=postgres \
                    --clean \
                    --if-exists \
                    --create \
                    --exit-on-error \
                    --jobs=4 \
                    "$dump"
                fi
              done

              psql \
                --host="$TARGET_HOST" \
                --username=postgres \
                --dbname=postgres \
                --no-psqlrc \
                --tuples-only \
                --no-align \
                --command="SELECT datname FROM pg_database WHERE NOT datistemplate ORDER BY datname" |
                while IFS= read -r database; do
                  test -n "$database"
                  vacuumdb \
                    --host="$TARGET_HOST" \
                    --username=postgres \
                    --dbname="$database" \
                    --analyze-only
                done
          env:
            - name: TARGET_HOST
              value: postgresql-v17
            - name: DUMP_DIRECTORY
              valueFrom:
                configMapKeyRef:
                  name: postgresql-migration
                  key: DUMP_DIRECTORY
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: postgres-password
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - mountPath: /backup
              name: database
              readOnly: true
            - mountPath: /tmp
              name: tmp
      volumes:
        - name: database
          nfs:
            path: /volume1/LTS/database
            server: diskstation.local
        - name: tmp
          emptyDir: {}
