{{- if .Values.wikijsBootstrap.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: wikijs-bootstrap-marker
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: wikijs-database-bootstrap
data:
  # Bump this value when the bootstrap hook must rerun, such as after rotating
  # the database password in both private Secrets.
  revision: {{ .Values.wikijsBootstrap.revision | quote }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: wikijs-database-bootstrap
  namespace: {{ .Release.Namespace }}
  annotations:
    # PostSync also works on a clean cluster; PreSync would wait forever for a
    # PostgreSQL Service that has not been created yet.
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wikijs-database-bootstrap
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          image: "{{ .Values.wikijsBootstrap.image.repository }}:{{ .Values.wikijsBootstrap.image.tag }}@{{ .Values.wikijsBootstrap.image.digest }}"
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-ec"]
          args:
            - |
              if [[ ! "$WIKIJS_DATABASE_PASSWORD" =~ ^[A-Za-z0-9_-]{32,}$ ]]; then
                echo "WIKIJS_DATABASE_PASSWORD must be at least 32 URL-safe characters" >&2
                exit 1
              fi
              until pg_isready -h postgresql -U postgres -d postgres; do
                sleep 2
              done
              psql -h postgresql -U postgres -d postgres \
                --set=ON_ERROR_STOP=1 \
                --set=wikijs_password="$WIKIJS_DATABASE_PASSWORD" <<'SQL'
              SELECT format('CREATE ROLE wikijs LOGIN PASSWORD %L', :'wikijs_password')
              WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'wikijs') \gexec
              ALTER ROLE wikijs WITH LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION
                PASSWORD :'wikijs_password';
              SELECT 'CREATE DATABASE wikijs OWNER wikijs'
              WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'wikijs') \gexec
              REVOKE ALL ON DATABASE wikijs FROM PUBLIC;
              GRANT CONNECT, TEMPORARY ON DATABASE wikijs TO wikijs;
              SQL
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: postgres-password
            - name: WIKIJS_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wikijs-database-bootstrap
                  key: WIKIJS_DATABASE_PASSWORD
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 5m
              memory: 32Mi
            limits:
              memory: 128Mi
{{- end }}
