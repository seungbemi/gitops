{{- if .Values.postgresql17.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgresql-v17
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "postgresql17.labels" . | nindent 4 }}
spec:
  serviceName: postgresql-v17-hl
  replicas: 1
  podManagementPolicy: OrderedReady
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      {{- include "postgresql17.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "postgresql17.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/version: "17.11"
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      securityContext:
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: initialize-data-directory
          image: busybox:1.38.0-uclibc
          command: ["/bin/sh", "-ec"]
          args:
            - |
              mkdir -p /var/lib/postgresql/data/pgdata
              chown -R 999:999 /var/lib/postgresql/data
              chmod 0700 /var/lib/postgresql/data/pgdata
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: false
            runAsUser: 0
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "DAC_OVERRIDE", "FOWNER"]
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 100m
              memory: 32Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      containers:
        - name: postgresql
          image: {{ include "postgresql17.image" . | quote }}
          imagePullPolicy: {{ .Values.postgresql17.image.pullPolicy }}
          args:
            - -c
            - shared_preload_libraries=vchord.so
            - -c
            - password_encryption=scram-sha-256
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_DB
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql17.auth.existingSecret }}
                  key: {{ .Values.postgresql17.auth.passwordKey }}
          ports:
            - name: postgresql
              containerPort: 5432
          startupProbe:
            exec:
              command: ["/bin/sh", "-ec", "pg_isready -U postgres -d postgres"]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            exec:
              command: ["/bin/sh", "-ec", "pg_isready -U postgres -d postgres"]
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["/bin/sh", "-ec", "pg_isready -U postgres -d postgres"]
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.postgresql17.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: dshm
              mountPath: /dev/shm
        {{- if .Values.postgresql17.metrics.enabled }}
        - name: metrics
          image: {{ include "postgresql17.metricsImage" . | quote }}
          imagePullPolicy: {{ .Values.postgresql17.metrics.image.pullPolicy }}
          env:
            - name: DATA_SOURCE_URI
              value: 127.0.0.1:5432/postgres?sslmode=disable
            - name: DATA_SOURCE_USER
              value: postgres
            - name: DATA_SOURCE_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql17.auth.existingSecret }}
                  key: {{ .Values.postgresql17.auth.passwordKey }}
          ports:
            - name: metrics
              containerPort: 9187
          readinessProbe:
            httpGet:
              path: /
              port: metrics
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: metrics
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.postgresql17.metrics.resources | nindent 12 }}
        {{- end }}
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "postgresql17.selectorLabels" . | nindent 10 }}
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.postgresql17.persistence.storageClass }}
        resources:
          requests:
            storage: {{ .Values.postgresql17.persistence.size }}
{{- end }}
