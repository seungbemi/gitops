apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-postgres-cronjob
  namespace: persistence
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: postgresql-backup
        spec:
          automountServiceAccountToken: false
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              image: {{ include "postgresql17.image" . | quote }}
              imagePullPolicy: {{ .Values.postgresql17.image.pullPolicy }}
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  umask 077
                  stamp="$(date -u +%Y%m%dT%H%M%SZ)"
                  root=/backups/postgresql
                  temporary="$root/.${stamp}.partial"
                  completed="$root/$stamp"
                  mkdir -p "$temporary"

                  pg_dumpall \
                    --host=postgresql \
                    --username=postgres \
                    --globals-only \
                    --quote-all-identifiers \
                    --file="$temporary/globals.sql"

                  psql \
                    --host=postgresql \
                    --username=postgres \
                    --dbname=postgres \
                    --no-psqlrc \
                    --tuples-only \
                    --no-align \
                    --command="SELECT datname FROM pg_database WHERE NOT datistemplate ORDER BY datname" |
                    while IFS= read -r database; do
                      test -n "$database"
                      pg_dump \
                        --host=postgresql \
                        --username=postgres \
                        --dbname="$database" \
                        --format=custom \
                        --compress=6 \
                        --quote-all-identifiers \
                        --file="$temporary/$database.dump"
                      pg_restore --list "$temporary/$database.dump" >/dev/null
                    done

                  (cd "$temporary" && sha256sum globals.sql ./*.dump > SHA256SUMS)
                  touch "$temporary/COMPLETE"
                  mv "$temporary" "$completed"
                  find "$root" \
                    -mindepth 1 \
                    -maxdepth 1 \
                    -type d \
                    -name '20????????T??????Z' \
                    -mtime +{{ .Values.backup.retentionDays }} \
                    -exec rm -rf -- {} +
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgres-secrets
                      key: postgres-password
                - name: TMPDIR
                  value: /tmp
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 1001
                runAsGroup: 1001
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: "1"
                  memory: 1Gi
              volumeMounts:
                - mountPath: /backups
                  name: backups
                - mountPath: /tmp
                  name: tmp
          restartPolicy: Never
          volumes:
            - name: backups
              nfs:
                path: {{ .Values.backup.nfs.path }}
                server: {{ .Values.backup.nfs.server }}
            - name: tmp
              emptyDir: {}
